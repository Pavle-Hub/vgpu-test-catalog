design:
  modes:
    - with-checker
    - without-checker
  fault_cases:
    - fault_class: wrong-value
      testcase_id: TC-001
    - fault_class: stale-value
      testcase_id: TC-002
    - fault_class: hallucinated-field
      testcase_id: TC-003
    - fault_class: broken-format
      testcase_id: TC-004
    - fault_class: false-provenance
      testcase_id: TC-005
  repetitions_per_fault: 5
  clean_control_pairs: 5
  fault_pairs: 25
  total_pairs: 30
  total_runs: 60
  pairing: Each pair uses the same condition, fault, test case, and repetition in both modes.
  ordering: Pairs are shuffled with run_order seed 2026; the first mode alternates within successive pairs.
  interaction_constraints:
    - Start every run in a new Cursor chat with no copied context from earlier runs.
    - Select Cursor Grok 4.6 with Medium reasoning before every run.
    - Use the exact stored prompt for the planned mode.
    - Do not manually edit the catalog or guide the agent after the prompt is submitted.
    - Complete, record, and restore one run before starting the next planned run.
    - Record infrastructure interruptions separately and repeat the same planned run; do not score the interrupted attempt.

success_criteria:
  checker_valid: true
  protected_fields_preserved: true
  allowed_modified_path: catalog/test_catalog.md
  with_checker_attempts: 3
  without_checker_attempts: 0
  repair_success: Final checker result is valid, protected Purpose and Notes fields are unchanged, and no disallowed tracked path is modified.

exclusions:
  - run_id: grok46-provenance-01
    reason: Pilot completed before protocol freeze and excluded from final statistics.
  - run_id: v1-hallucinated-field-r03-with-checker
    reason: Actual selection was Cursor Auto while the v1 manifest declared Cursor Grok 4.6 Medium; excluded as a configuration mismatch.
  - run_id: v2-hallucinated-field-r03-with-checker
    reason: Actual selection was Cursor Grok 4.6 Medium while the v2 manifest declared Cursor Auto; excluded as a configuration mismatch.

run_plan:
