[mcp_servers."metrics-mcp"]
command = ".venv/Scripts/python.exe"
args = ["-m", "metrics_mcp.server", "--dataset", "dataset"]
cwd = "."
enabled = true
startup_timeout_sec = 20
tool_timeout_sec = 60

