[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vgpu-test-catalog"
version = "0.1.0"
description = "Reliable AI-agent maintenance of a synthetic vGPU test catalog"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "jsonschema>=4,<5",
  "mcp>=2,<3",
  "PyYAML>=6,<7",
]

[project.scripts]
generate-dataset = "vgpu_catalog.dataset:main"
validate-dataset = "vgpu_catalog.validation:main"
derive-catalog-data = "vgpu_catalog.derivation:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/vgpu_catalog",
  "src/catalog_check",
  "src/metrics_mcp",
  "src/env_mcp",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=.tmp/pytest"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

